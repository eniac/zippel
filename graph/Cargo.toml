[package]
name = "graph"
version = "0.1.0"
edition.workspace = true

[dependencies]
petgraph = "0.7.1"
thiserror = "2.0.11"
backend = { path = "../backend" }
share = { path = "../share" }
lang = { path = "../lang" }
ark-ff = { version = "0.6", features = ["parallel"] }
ark-poly = { version = "0.6", features = ["parallel"] }
ark-bls12-381 = { version = "0.6" }
ark-std = { version = "0.6.0", features = ["parallel"] }
log = "0.4.27"
num = "0.4.3"
spongefish = { version = "0.7", features = [
    "ark-ff",
    "ark-ec",
    "blake3",
] }

[features]
# Test helpers (`graph::testing`) for this and other workspace crates' tests.
testing = []

[dev-dependencies]
rand = { version = "0.8", features = ["std"] }
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"
insta = "1.48"
serial_test = "3.2.0"
