[package]
name = "graph"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10.0"
num-bigint = "0.4.6"
petgraph = "0.7.1"
thiserror = "2.0.11"
backend = { path = "../backend" }
share = { path = "../share" }
lang = { path = "../lang" }
ark-ff =  { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec =  { git = "https://github.com/arkworks-rs/algebra.git" }
symbolica = "0.16.0"
log = "0.4.27"
good_lp = { version = "1.13.0", features = ["lp-solvers", ], default-features = false}
grb = { version = "3.0.1", features = ["gurobi12"], default-features = false }

[dev-dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"
serial_test = "3.2.0"
