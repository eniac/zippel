[package]
name = "fmt"
version = "0.1.0"
edition = "2024"

[dependencies]
pretty = "0.12.3"
lang = { path = "../lang" }
share = { path = "../share" }
similar = "2.7"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "zippel-fmt"
path = "src/bin/zippel-fmt.rs"

[[bench]]
name = "format"
harness = false
