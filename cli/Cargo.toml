[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
backend = { path = "../backend" }
share = { path = "../share" }
lang = { path = "../lang" }
graph = { path = "../graph" }
costs = { path = "../costs" }
runtime = { path = "../runtime" }
criterion = "0.5.1"
serde_json = "1.0.140"
rayon = "1.10.0"
env_logger = "0.11.8"
log = "0.4.27"
num_cpus = "1.17.0"
ark-std = "0.5.0"
ark-ff =  { git = "https://github.com/arkworks-rs/algebra.git" }
rand = { version = "0.8", features = ["std"] }
spongefish =  { git = "https://github.com/arkworks-rs/spongefish.git", features = ["arkworks-algebra"] }
bincode = "2.0.1"
