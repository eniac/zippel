[workspace]
members = ["lang", "runtime", "share", "graph", "backend", "analyses"]
exclude = ["sumcheck_compare", "benchmarks"]
default-members = [".", "lang", "runtime", "share", "graph", "backend", "analyses"]
resolver = "2"

[lints.rust]
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
uninlined_format_args = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"

[package]
name = "zippel"
version = "0.1.0"
edition = "2024"
autoexamples = false

[dependencies]
backend = { path = "./backend" }
share = { path = "./share" }
lang = { path = "./lang" }
graph = { path = "./graph" }
analyses = { path = "./analyses" }
runtime = { path = "./runtime" }
env_logger = "0.11.8"
log = "0.4.27"
ark-std = { version = "0.6.0", features = ["parallel"] }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git", features = [
    "parallel",
] }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git", features = [
    "parallel",
] }
rand = { version = "0.8", features = ["std"] }
spongefish = { git = "https://github.com/arkworks-rs/spongefish.git", branch = "main", features = [
    "ark-ff",
    "ark-ec",
] }

[dev-dependencies]
analyses = { path = "./analyses" }
tempfile = "3.10"
criterion = "0.5"
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-groth16 = { git = "https://github.com/arkworks-rs/groth16.git", branch = "release/0.6.0" }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0" }
petgraph = "0.7.1"

[patch.crates-io]
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-std = { git = "https://github.com/arkworks-rs/std.git", branch = "release/0.6.0" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git", branch = "release/0.6.0" }
ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std.git", branch = "release/0.6.0" }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0" }
ark-snark = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0" }
ark-groth16 = { git = "https://github.com/arkworks-rs/groth16.git", branch = "release/0.6.0" }

