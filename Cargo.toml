[workspace]
members = ["lang", "lang/lang-derive", "runtime", "share", "graph", "backend", "analyses", "fmt", "benchmarks"]
default-members = [".", "lang", "runtime", "share", "graph", "backend", "analyses"]
resolver = "2"

[lints.rust]
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
uninlined_format_args = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"

# Full debug info (the `dev` default) is the dominant consumer of `target/`:
# on windows-msvc every linked binary gets its own .pdb, and arkworks generics
# are instantiated — and therefore given debug info — inside our own crates.
# Line tables keep file:line backtraces at a fraction of the size.
# One-off full debugging: `CARGO_PROFILE_DEV_DEBUG=2 cargo build ...`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[package]
name = "zippel"
version = "0.1.0"
edition = "2024"
autoexamples = false

[dependencies]
backend = { path = "./backend" }
share = { path = "./share" }
lang = { path = "./lang" }
graph = { path = "./graph" }
analyses = { path = "./analyses" }
runtime = { path = "./runtime" }
log = "0.4.27"

[dev-dependencies]
analyses = { path = "./analyses" }
env_logger = "0.11.8"
libc = "0.2"
tempfile = "3.10"
criterion = "0.5"
ark-std = { version = "0.6", features = ["parallel"] }
ark-ff = { version = "0.6", features = ["parallel"] }
ark-poly = { version = "0.6", features = ["parallel"] }
rand = { version = "0.8", features = ["std"] }
ark-bls12-381 = { version = "0.6" }
ark-ec = { version = "0.6" }
ark-groth16 = { version = "0.6" }
ark-relations = { version = "0.6" }
petgraph = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }

# [patch.crates-io]
# ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git", branch = "release/0.6.0" }
# ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std.git", branch = "release/0.6.0" }
# ark-snark = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0" }

[[bench]]
name = "execution"
test = false
harness = false

[[bench]]
name = "compilation"
harness = false

[[example]]
name = "zippel"
path = "examples/main.rs"
test = false
harness = false

[[bench]]
name = "inline"
path = "benches/inline/main.rs"
test = false
harness = false

[[bench]]
name = "inline_all"
path = "benches/inline/all.rs"
test = false
harness = false
