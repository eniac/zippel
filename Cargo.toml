[workspace]
members = [ "lang", "runtime", "share" , "graph", "backend"]
exclude = [ "sumcheck_compare" ]
default-members = [ ".", "lang", "runtime", "share" , "graph", "backend"]
resolver = "2"

[package]
name = "zippel"
version = "0.1.0"
edition = "2024"

[dependencies]
backend = { path = "./backend" }
share = { path = "./share" }
lang = { path = "./lang" }
graph = { path = "./graph" }
runtime = { path = "./runtime" }
env_logger = "0.11.8"
log = "0.4.27"
ark-std = "0.5.0"
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
rand = { version = "0.8", features = ["std"] }
spongefish =  { git = "https://github.com/arkworks-rs/spongefish.git", branch = "main", features = ["ark-ff", "ark-ec"] }

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
petgraph = "0.7.1"

[[bench]]
name = "graph_execution"
harness = false

[[bench]]
name = "groebner"
harness = false

