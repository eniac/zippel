[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# `cfg_into_iter!` and friends in arkworks check `feature = "parallel"` in
# the *calling* crate, so the vendored hyperplonk sumcheck stack needs us
# to forward our own parallel flag down. Default-on; the only reason to
# turn it off would be a single-threaded sanity run.
default = ["parallel"]
parallel = ["ark-std/parallel", "ark-ff/parallel", "ark-ec/parallel", "ark-poly/parallel"]

[dependencies]
# Zippel side (uses arkworks from git main, via backend's transitive deps).
zippel = { path = ".." }
backend = { path = "../backend" }
share = { path = "../share" }
lang = { path = "../lang" }

# Zippel-side arkworks (git main — must match backend's version exactly,
# otherwise `DenseMultilinearExtension` from this crate is a different
# type than the one backend's PolyVariant accepts). Used everywhere now
# that the hyperplonk sumcheck stack has been vendored under
# `src/sumcheck_upstream/` (so the `arithmetic`/`subroutines`/
# `transcript` git deps that the native sumcheck/pst13 baselines used to
# pull are gone).
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-curve25519 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-std = { version = "0.5", features = ["parallel"] }

# blake2 is used by the schnorr native (Schnorr<G, Blake2s256> from
# ark-crypto-primitives).
blake2 = "0.10"

merlin = "3"
rayon = "1"

rand = { version = "0.8", features = ["std"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Native Spartan baseline: Microsoft's Spartan crate (NOT Spartan2). The
# crate is `spartan` on crates.io, with both NIZK and SNARK variants.
# Pulls in its own curve25519-dalek stack — no arkworks dependency, so
# it coexists with everything else here without version conflicts.
# `merlin` (transcript) is already a dep via the bp-* native IPA baseline.
spartan = { version = "0.9", features = ["multicore"] }
curve25519-dalek = { version = "4", features = ["serde", "rand_core"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

# Native PARI baseline: code vendored from alireza-shirzad/garuda-pari
# (see benchmarks/src/pari_upstream/). Uses zippel's already-pinned
# algebra.git git-main arkworks set; no separate np-/hp-/bp- namespace
# needed. `ark-relations` (with the gr1cs API) comes from snark.git via
# the workspace [patch.crates-io]. `displaydoc` is for transcript errors.
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0", default-features = false }
displaydoc = { version = "0.2", default-features = false }
num-bigint = "0.4"

# 0.6 native baselines — crates.io 0.6.0 of ark-poly-commit (kzg, hyrax),
# ark-groth16 (groth16), ark-crypto-primitives (schnorr, hyrax sponge),
# and ark-secp256k1 (ipa). Their ark-ff/ec/poly transitive deps unify
# with the zippel-side algebra.git 0.6 pin via [patch.crates-io], so
# MSM/Pairing primitives are bit-identical on both sides.
ark-poly-commit = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6", default-features = false }
ark-crypto-primitives = { version = "0.6", default-features = false, features = ["sponge", "signature"] }
ark-secp256k1 = { version = "0.6", default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "sumcheck"
path = "src/bin/sumcheck.rs"

[[bin]]
name = "schnorr"
path = "src/bin/schnorr.rs"

[[bin]]
name = "ipa"
path = "src/bin/ipa.rs"

[[bin]]
name = "kzg"
path = "src/bin/kzg.rs"

[[bin]]
name = "pari"
path = "src/bin/pari.rs"

[[bin]]
name = "groth16"
path = "src/bin/groth16.rs"

[[bin]]
name = "pst13"
path = "src/bin/pst13.rs"

[[bin]]
name = "hyrax"
path = "src/bin/hyrax.rs"

[[bin]]
name = "groth16_profile"
path = "src/bin/groth16_profile.rs"

[[bin]]
name = "bench_all"
path = "src/bin/bench_all.rs"

[[bin]]
# Renamed from `spartan` to avoid colliding with the `spartan` crate
# in our deps (Rust resolves `spartan::` to the binary's empty module
# otherwise, masking the `spartan` crate at use sites).
name = "spartan_bench"
path = "src/bin/spartan_bench.rs"

[[bin]]
name = "spartan_compare"
path = "src/bin/spartan_compare.rs"

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "schnorr"
harness = false

[[bench]]
name = "ipa"
harness = false

[[bench]]
name = "kzg"
harness = false

# Mirror the workspace's `[patch.crates-io]`: benchmarks is excluded from
# the workspace (it has the np-/hp-/bp- 0.5/0.4 aliases that can't coexist
# with the workspace patches), so the workspace overrides don't apply
# transitively. Without this section here, deps that pull `ark-ff = "0.6"`
# from crates.io (e.g. ark-relations from snark.git release/0.6.0) get a
# DIFFERENT ark-ff than our direct `ark-ff = { git = "algebra.git" }` dep
# — same version, different sources, distinct types. The semver mismatch
# between algebra.git (0.6) and the np-* aliases (0.5) means the np-* set
# correctly falls through to crates.io and is NOT collapsed.
[patch.crates-io]
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-std = { git = "https://github.com/arkworks-rs/std.git", branch = "release/0.6.0" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-secp256k1 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", branch = "release/0.6.0" }
