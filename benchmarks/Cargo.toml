[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
# Explicit `for i in a..b { ...v[i]... }` reads more plainly than the
# iterator-adapter chains clippy suggests here, especially once a loop
# body indexes more than one array by the same `i`.
needless_range_loop = "allow"

[lints.cargo]
# `colored` backs the vendored `ark_spartan_upstream::timer` module's
# `#[cfg(feature = "profile")]` prints; it looks unused because we never
# wired up a `profile` feature here. Leave the vendored module as-is and
# just silence the false positive rather than dropping the dependency.
unused_dependencies = "allow"
# These binary names mirror their `.rs` filenames and are used as-is by
# benchmarks/run_*.sh and docs/RUNBOOK.md; not worth a rename+doc churn.
non_kebab_case_bins = "allow"

[features]
# `cfg_into_iter!` and friends in arkworks check `feature = "parallel"` in
# the *calling* crate, so the vendored hyperplonk sumcheck stack needs us
# to forward our own parallel flag down. Default-on; the only reason to
# turn it off would be a single-threaded sanity run.
default = ["parallel", "multicore"]
parallel = ["ark-std/parallel", "ark-ff/parallel", "ark-ec/parallel", "ark-poly/parallel"]
# `multicore` is a no-op feature that just unlocks the `#[cfg(feature =
# "multicore")]` branches inside the vendored `ark_spartan_upstream`
# module. It doesn't gate any dep — rayon is unconditional workspace-wide.
multicore = []
sol = []

[dependencies]
# Zippel side.
zippel = { path = ".." }
backend = { path = "../backend" }
share = { path = "../share" }
lang = { path = "../lang" }

# Arkworks 0.6 from crates.io — must match backend's version exactly,
# otherwise `DenseMultilinearExtension` from this crate is a different
# type than the one backend's PolyVariant accepts. Used everywhere now
# that the hyperplonk sumcheck stack has been vendored under
# `src/sumcheck_upstream/`.
ark-ff = "0.6"
ark-poly = "0.6"
ark-ec = "0.6"
ark-serialize = "0.6"
ark-bls12-381 = "0.6"
ark-curve25519 = "0.6"
ark-std = "0.6"

# blake2 is used by the schnorr native (Schnorr<G, Blake2s256> from
# ark-crypto-primitives).
blake2 = "0.10"

merlin = "3"
rayon = "1"

rand = { version = "0.8", features = ["std"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Native Spartan baseline: Microsoft's Spartan crate (NOT Spartan2). The
# crate is `spartan` on crates.io, with both NIZK and SNARK variants.
# Pulls in its own curve25519-dalek stack — no arkworks dependency, so
# it coexists with everything else here without version conflicts.
# `merlin` (transcript) is already a dep via the bp-* native IPA baseline.
spartan = { version = "0.9", features = ["multicore"] }
curve25519-dalek = { version = "4", features = ["serde", "rand_core"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

# Second native Spartan baseline: ark-spartan (Zhang's arkworks port of
# Setty's Spartan), vendored under `src/ark_spartan_upstream/` and
# hand-ported from arkworks 0.3 → 0.6 in-place. Runs on the SAME
# `ark-curve25519 0.6` scalar/group types as the zippel side, so the
# zippel-vs-ark-spartan comparison is same-curve, same-ark-version —
# the true apples-to-apples that libspartan (curve25519-dalek stack)
# can't provide.
sha3 = "0.10"
digest = "0.10"
rand_chacha = "0.3"
itertools = "0.13"
thiserror = "1"
subtle = "2"
zeroize = "1"
colored = "2"

# Native PARI baseline: code vendored from alireza-shirzad/garuda-pari
# (see benchmarks/src/pari_upstream/). Uses the workspace's crates.io
# 0.6 arkworks set. `ark-relations` (with the gr1cs API) comes from
# crates.io 0.6. `displaydoc` is for transcript errors.
#
# IMPORTANT: each `default-features = false` dep below MUST also enable
# `parallel` explicitly. The 4 crates with the `parallel` feature gate
# rayon-based loops INSIDE them (e.g. ark-poly-commit's Hyrax row
# iteration, ark-groth16's `compute_h` parallelism, ark-relations'
# witness assignment). Without `parallel`, our own `ark-ff/parallel`
# only buys MSM-level concurrency — the higher-level loops in the
# native baselines run single-threaded and the comparison is unfair.
ark-relations = { version = "0.6", default-features = false, features = ["parallel"] }
displaydoc = { version = "0.2", default-features = false }
num-bigint = "0.4"

# 0.6 native baselines — crates.io 0.6.0 of ark-poly-commit (kzg, hyrax),
# ark-groth16 (groth16), ark-crypto-primitives (schnorr, hyrax sponge),
# and ark-secp256k1 (ipa). Their ark-ff/ec/poly transitive deps unify
# with the workspace's crates.io 0.6 pin, so MSM/Pairing primitives are
# bit-identical on both sides.
ark-poly-commit = { version = "0.6", default-features = false, features = ["parallel"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["parallel"] }
ark-crypto-primitives = { version = "0.6", default-features = false, features = ["sponge", "signature", "parallel"] }
ark-secp256k1 = { version = "0.6", default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "sumcheck"
path = "src/bin/sumcheck.rs"

[[bin]]
name = "schnorr"
path = "src/bin/schnorr.rs"

[[bin]]
name = "ipa"
path = "src/bin/ipa.rs"

[[bin]]
name = "kzg"
path = "src/bin/kzg.rs"

[[bin]]
name = "pari"
path = "src/bin/pari.rs"

[[bin]]
name = "groth16"
path = "src/bin/groth16.rs"

[[bin]]
name = "pst13"
path = "src/bin/pst13.rs"

[[bin]]
name = "hyrax"
path = "src/bin/hyrax.rs"

[[bin]]
name = "groth16_profile"
path = "src/bin/groth16_profile.rs"

[[bin]]
name = "bench_all"
path = "src/bin/bench_all.rs"

[[bin]]
# Renamed from `spartan` to avoid colliding with the `spartan` crate
# in our deps (Rust resolves `spartan::` to the binary's empty module
# otherwise, masking the `spartan` crate at use sites).
name = "spartan_bench"
path = "src/bin/spartan_bench.rs"

[[bin]]
name = "spartan_compare"
path = "src/bin/spartan_compare.rs"

[[bin]]
# Phase-0 ceiling test for a dot_batch primitive: does a shared-setup
# batched Pippenger beat K independent arkworks msm calls at the
# Spartan row-commit shapes? See the bin's doc comment for the
# decision rule.
name = "msm_batch_ceiling"
path = "src/bin/msm_batch_ceiling.rs"

[[bin]]
# Same-binary head-to-head of zippel's c_rows loop vs ark-spartan's
# DensePolynomial::commit — re-attribution of the M=17->18 "MSM cliff".
name = "commit_head_to_head"
path = "src/bin/commit_head_to_head.rs"

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "schnorr"
harness = false

[[bench]]
name = "ipa"
harness = false

[[bench]]
name = "kzg"
harness = false
