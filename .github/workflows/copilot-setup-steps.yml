# Customizes the environment used by the GitHub Copilot coding agent.
#
# The default `ubuntu-latest` runner only has ~14 GB free disk, which is
# not enough for a full Zippel build (large arkworks dep graph on nightly
# + the workspace's `target/`). Rather than upgrade to a paid larger
# runner, we delete pre-installed OS tooling the agent doesn't need
# (Android SDK, .NET, Haskell, Docker images, …) to reclaim ~31 GB before
# the agent session starts.
#
# Complement: `.github/copilot-instructions.md` has a "Disk hygiene"
# section telling the agent to run `cargo clean -p <crate>` if `target/`
# itself bloats during a long session.

name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
