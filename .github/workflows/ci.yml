name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'artifact/**'
      - 'LICENSE-MIT'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'artifact/**'
      - 'LICENSE-MIT'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Check for Windows reserved-name path components
        shell: bash
        run: bash .github/scripts/check-windows-reserved-names.sh

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc
          rm -rf /var/lib/apt/lists/*

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      # The heap-profiling code is behind a feature the step above leaves
      # off; build and lint it too, so it cannot rot unnoticed.
      - name: cargo clippy (benchmarks, dhat feature)
        run: cargo clippy -p benchmarks --all-targets --features dhat

  zippel-fmt:
    name: zippel-fmt --check examples
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc
          rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: zippel-fmt --check examples
        run: cargo run -p fmt --bin zippel-fmt -- --check examples/*/*.zippel

  test:
    name: Test
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Check for Windows reserved-name path components
        shell: bash
        run: bash .github/scripts/check-windows-reserved-names.sh

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc singular
          rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace
