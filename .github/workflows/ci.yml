name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Check for Windows reserved-name path components
        shell: bash
        run: bash .github/scripts/check-windows-reserved-names.sh

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc m4 pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo check benchmarks
        run: cargo check --manifest-path benchmarks/Cargo.toml --all-targets

  zippel-fmt:
    name: zippel-fmt --check examples
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc m4 pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: zippel-fmt --check examples
        run: cargo run -p fmt --bin zippel-fmt -- --check examples/*/*.zippel

  test:
    name: Test
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      - uses: actions/checkout@v4

      - name: Check for Windows reserved-name path components
        shell: bash
        run: bash .github/scripts/check-windows-reserved-names.sh

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc m4 pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test benchmarks sumcheck_gate
        run: cargo test --manifest-path benchmarks/Cargo.toml sumcheck_gate
