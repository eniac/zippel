[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10.0"
rand = { version = "0.8", features = ["std"] }
petgraph = "0.7.1"
thiserror = "2.0.11"
graph = { path = "../graph" }
share = { path = "../share" }
lang = { path = "../lang" }
backend = { path = "../backend" }
num_cpus = "1.16.0"
ark-std = "0.5.0"
spongefish =  { git = "https://github.com/arkworks-rs/spongefish.git", features = ["arkworks-algebra"] }

[dev-dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"


