[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true

[dependencies]
rayon = "1.10.0"
rand = { version = "0.8", features = ["std"] }
petgraph = "0.7.1"
thiserror = "2.0.11"
graph = { path = "../graph" }
share = { path = "../share" }
lang = { path = "../lang" }
backend = { path = "../backend" }
ark-ff = { version = "0.6", features = ["parallel"] }
log = "0.4.27"
spongefish =  { version = "0.7", features = ["ark-ff", "ark-ec"] }

[dev-dependencies]
ark-poly = { version = "0.6", features = ["parallel"] }
serial_test = "3.2.0"
ark-std = { version = "0.6.0", features = ["parallel"] }
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"


