[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true

[dependencies]
rayon = "1.10.0"
rand = { version = "0.8", features = ["std"] }
petgraph = "0.7.1"
thiserror = "2.0.11"
graph = { path = "../graph" }
share = { path = "../share" }
lang = { path = "../lang" }
backend = { path = "../backend" }
log = "0.4.27"
spongefish = "0.7"

[dev-dependencies]
graph = { path = "../graph", features = ["testing"] }
ark-ff = { version = "0.6", features = ["parallel"] }
ark-std = { version = "0.6.0", features = ["parallel"] }
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"


insta = "1.48"
