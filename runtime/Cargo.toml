[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10.0"
crossbeam-channel = "0.5"
rand = { version = "0.8", features = ["std"] }
petgraph = "0.7.1"
thiserror = "2.0.11"
graph = { path = "../graph" }
share = { path = "../share" }
lang = { path = "../lang" }
backend = { path = "../backend" }

ark-std = { version = "0.5.0", features = ["parallel"] }
log = "0.4.27"
spongefish =  { git = "https://github.com/arkworks-rs/spongefish.git", branch = "main", features = ["ark-ff", "ark-ec"] }

[dev-dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
arbtest = "0.3.2"


