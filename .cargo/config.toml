[env]
SYMBOLICA_HIDE_BANNER = "1"

[alias]
# Make 'cargo test' default to testing the entire workspace
# This ensures all member crate tests run without needing --workspace flag
test-all = "test --workspace"

# Shorthand for running tests with output
test-verbose = "test --workspace -- --nocapture"

# Run tests with coverage
test-coverage = "tarpaulin --workspace --out Html --output-dir coverage"

# Run one protocol out of the single `zippel` example binary.
#   cargo zrun ipa               (dev; no argument lists every example)
#   cargo zrunr hyperplonk_piop  (release)
zrun = "run -p zippel --example zippel --"
zrunr = "run --release -p zippel --example zippel --"

# Run every compile-time check on .zippel files without a harness or inputs.
#   cargo zcheck examples/kzg/kzg.zippel
#   cargo zcheck --size N=2 examples/marlin_kzg/marlin_kzg.zippel
zcheck = "run -q -p check --bin zippel-check --"

# Format .zippel files.
#   cargo zfmt --check examples/*/*.zippel
#   cargo zfmt --write examples/kzg/kzg.zippel
zfmt = "run -q -p fmt --bin zippel-fmt --"

